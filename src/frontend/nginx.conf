server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── AuthService (puerto interno 80) ──────────────────────────────
    # /api/auth/*  y  /api/users/*
    location ~ ^/api/(auth|users)(/|$) {
        proxy_pass http://auth-service:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── EquipmentService (puerto interno 80) ─────────────────────────
    # /api/equipments/*  /api/equipment-types/*  /api/import/*
    location ~ ^/api/(equipments|equipment-types|import)(/|$) {
        proxy_pass http://equipment-service:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── LocationService (puerto interno 80) ──────────────────────────
    # /api/laboratorios/*  /api/equipment-locations/*
    location ~ ^/api/(laboratorios|equipment-locations)(/|$) {
        proxy_pass http://location-service:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── MaintenanceService (puerto interno 80) ───────────────────────
    # /api/tickets/*  /api/catalog/*  /api/resources/*
    # /api/status/*  /api/reportes/*  /api/ticket-activities-diagnoses/*
    # /api/ticket-technicians/*  /api/equipment-lifecycle/*
    location ~ ^/api/(tickets|catalog|resources|status|reportes|ticket-activities-diagnoses|ticket-technicians|equipment-lifecycle)(/|$) {
        proxy_pass http://maintenance-service:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}